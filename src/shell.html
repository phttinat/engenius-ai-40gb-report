<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#111A2E;--ink2:#3A4356;--ink3:#626B7C;--ground:#F5F4EF;--line:#D9D8D0;--track:#E7E6DF;
  --navy:#0A1F66;--teal:#0B6E6E;--tealL:#CFE7E3;--sun:#F2A900;--sunL:#FCEBBB;--red:#C8202B;--redL:#F8D9D4}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#111A2E;color:var(--ink);font-family:'Sarabun',Tahoma,sans-serif;overflow:hidden}
::selection{background:var(--sun);color:var(--ink)}
.stage{position:fixed;inset:0 0 52px 0;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;width:1920px;height:1080px;transform-origin:center center;display:none;overflow:hidden;background:var(--ground);grid-template-columns:440px 1fr;-webkit-user-select:text;user-select:text;cursor:text}
.slide.on{display:grid}
h1,h2,h3{font-family:'Bai Jamjuree','Sarabun',sans-serif}
/* rail: each chapter owns a full-height colour field */
.rail{padding:40px 44px;display:flex;flex-direction:column;gap:38px;position:relative;color:#fff}
.rail.navy{background:var(--navy)}.rail.teal{background:var(--teal)}.rail.red{background:var(--red)}.rail.ink{background:var(--ink)}.rail.sun{background:var(--sun);color:var(--ink)}
.tile{background:#fff;padding:9px 13px;border-radius:4px;align-self:flex-start;display:block}.tile img{height:58px;display:block}
.rail h2{font-size:45px;font-weight:700;line-height:1.26}
.pg-no{position:absolute;left:44px;bottom:34px;font:600 26px 'Bai Jamjuree',sans-serif;opacity:.8}
.rail-num{margin-top:auto;margin-bottom:58px;display:flex;flex-direction:column}.rail-num b{font:700 118px/1 'Bai Jamjuree',sans-serif}.rail-num span{font-size:25px;line-height:1.35;font-weight:600}
/* body */
.body{padding:44px 56px 34px;display:flex;flex-direction:column;gap:22px;min-width:0;min-height:0}
.body.row{display:grid;grid-template-columns:1fr 410px;grid-template-rows:1fr auto;gap:18px 30px}
h3{font-size:29px;font-weight:600;line-height:1.3}
footer{margin-top:auto;font-size:21px;line-height:1.42;color:var(--ink3)}footer.wide{grid-column:1 / -1;margin:0}
.note{font-size:22px;line-height:1.4;color:var(--ink2);margin-top:10px}
.strip{font-size:26px;font-weight:600;padding:15px 24px;line-height:1.36}
.strip.red{background:var(--red);color:#fff}.strip.sun{background:var(--sun)}.strip.teal{background:var(--teal);color:#fff}
/* stat row: numbers on the ground, hairlines between */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:4px solid var(--ink);border-bottom:1px solid var(--line)}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stats>div{padding:14px 20px 14px 0;display:flex;flex-direction:column;gap:2px}.stats>div+div{padding-left:22px;border-left:1px solid var(--line)}
.stats b{font:700 47px/1.14 'Bai Jamjuree',sans-serif;white-space:nowrap;color:var(--navy)}.stats.three b{font-size:39px}
.stats>div:nth-child(2) b{color:var(--teal)}.stats>div:nth-child(3) b{color:var(--red)}.stats>div:nth-child(4) b{color:#986A00}
.stats span{font-size:22px;color:var(--ink2);line-height:1.35}
.two{display:grid;grid-template-columns:1fr 1fr;gap:44px;flex:1;min-height:0}.two>div{display:flex;flex-direction:column;gap:12px;min-height:0}
.two.peak{grid-template-columns:.9fr 1.1fr}
/* tables */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:21px;font-weight:600;text-align:left;padding:9px 12px;color:var(--ink3);border-bottom:2px solid var(--ink);line-height:1.25}
td{font-size:24px;padding:11px 12px;border-bottom:1px solid var(--line);line-height:1.34}
.r{text-align:right;white-space:nowrap}.c{text-align:center}
tr.mark td{background:var(--sunL)}
/* cover */
.cover{grid-template-columns:1fr 520px;background:var(--navy)}
.c-main{padding:64px 72px 72px;display:flex;flex-direction:column;justify-content:space-between;color:#fff}.c-main .tile img{height:82px}
.cover h1{font-size:80px;font-weight:700;line-height:1.2;margin-bottom:26px}.c-main p{font-size:30px;line-height:1.4;color:#D3DAF2}
.c-side{display:grid;grid-template-rows:repeat(4,1fr)}.c-side>div{padding:0 44px;display:flex;flex-direction:column;justify-content:center;gap:4px;color:#fff}
.c-side b{font:700 72px/1.08 'Bai Jamjuree',sans-serif;white-space:nowrap}.c-side span{font-size:25px;line-height:1.3}
.c-side .teal{background:var(--teal)}.c-side .sun{background:var(--sun);color:var(--ink)}.c-side .red{background:var(--red)}.c-side .ink{background:var(--ink)}
/* summary */
.def{display:grid;grid-template-columns:180px 1fr;border-top:4px solid var(--ink)}
.def dt{font:600 27px 'Bai Jamjuree',sans-serif;padding:13px 0;color:var(--navy);border-bottom:1px solid var(--line)}.def dd{font-size:25px;line-height:1.42;padding:13px 0;border-bottom:1px solid var(--line);color:var(--ink2)}
.cap-chart{display:flex;flex-direction:column;gap:7px;flex:1}.unit{font-size:21px;color:var(--ink3);margin-top:-6px}
.hb{display:grid;grid-template-columns:430px 1fr 52px;gap:14px;align-items:center;min-height:32px}.hb.gap{margin-top:12px}
.hb label{font-size:24px}.hb>div{height:22px;background:var(--track)}.hb i,.ct i{display:block;height:100%}.hb b{font:700 27px 'Bai Jamjuree',sans-serif;text-align:right}
.t{background:var(--teal)}.s{background:var(--sun)}.x{background:var(--red)}
/* charts */
.vb{display:flex;align-items:flex-end;gap:18px;flex:1}.vb>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end}
.vb i{display:block;width:100%;background:#8CC6BE}.vb i.on{background:var(--teal)}.vb b{font:700 26px 'Bai Jamjuree',sans-serif}.vb span{font-size:22px;color:var(--ink3)}
.fn{display:flex;flex-direction:column;gap:13px;flex:1;justify-content:center}.fn>div{display:grid;grid-template-columns:128px 1fr;align-items:baseline;row-gap:5px}
.fn b{font:700 33px 'Bai Jamjuree',sans-serif}.fn p{font-size:24px;color:var(--ink2)}.fn i{grid-column:1 / -1;display:block;height:16px}
.hours{display:flex;align-items:flex-end;gap:5px;height:330px;border-bottom:3px solid var(--ink)}.hours i{flex:1;display:block;background:#E5C777}.hours i.on{background:var(--red)}
.axis{display:flex;justify-content:space-between;font-size:21px;color:var(--ink2)}
/* resources */
.res td{padding:13px 12px}.use{height:20px;background:var(--track);position:relative}.use i{position:absolute;left:0;top:0;bottom:0;display:block}.use .max{background:#8CC6BE}.use .avg{background:var(--teal)}.use .max.hot{background:#EFA69C}.use .avg.hot{background:var(--red)}
.legend{display:flex;gap:26px;font-size:21px;color:var(--ink2);margin-top:-10px}.legend span{display:flex;align-items:center;gap:8px}.legend i{width:26px;height:14px;display:block}.legend .avg{background:var(--teal)}.legend .max{background:#8CC6BE}
/* risk */
.risk{flex:1}.risk td{font-size:27px;padding:25px 14px}.risk td:first-child{font-weight:600}.risk th{font-size:23px}
em{font-style:normal;font-weight:700;font-size:24px;padding:5px 16px;display:inline-block;white-space:nowrap}.vh{background:var(--red);color:#fff}.h{background:var(--redL);color:#94151E}.m{background:var(--sunL);color:#6F4D00}
/* cost */
.cost{display:flex;flex-direction:column;gap:9px}
.ct{display:grid;grid-template-columns:356px 1fr 216px;column-gap:14px;align-items:center}.ct label{font-size:24px}.ct b{font:700 25px 'Bai Jamjuree',sans-serif;white-space:nowrap}
.tr{height:26px;background:var(--track);position:relative}.tr u{position:absolute;left:83.33%;top:-6px;bottom:-6px;border-left:3px dashed var(--ink)}
.matrix th{font-size:20px;padding:7px 6px}.matrix td{font-size:23px;padding:12px 10px}.matrix td.c{font-weight:600;border-left:4px solid var(--ground);white-space:nowrap}
.ok{background:var(--tealL);color:#075353}.no{background:var(--redL);color:#94151E}.mid{background:var(--sunL);color:#6F4D00}
/* measures */
.measures td{padding:15px 12px}.measures td:first-child{font-weight:600}
.block{padding:28px 30px;display:flex;flex-direction:column;gap:12px}.block.sun{background:var(--sun)}.block p{font-size:23px;line-height:1.4}
.kv{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(17,26,46,.35);padding-bottom:6px;font-size:24px}.kv b{font:700 30px 'Bai Jamjuree',sans-serif}
/* plan */
.tl{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:18px;counter-reset:s;border-top:6px solid var(--navy)}
.tl li{counter-increment:s;display:flex;flex-direction:column;gap:6px;padding-top:16px}
.tl li::before{content:counter(s);font:700 44px/1 'Bai Jamjuree',sans-serif;color:var(--teal)}
.tl b{font:700 27px/1.25 'Bai Jamjuree',sans-serif}.tl span{font-size:23px;line-height:1.38;color:var(--ink2)}
.asks{display:grid;grid-template-columns:1fr 1fr;gap:16px 34px;flex:1;align-content:start}.asks h3{grid-column:1 / -1;font-size:32px}
.ask{display:flex;flex-direction:column;gap:5px;border-top:2px solid var(--ink);padding-top:12px}.ask b{font-size:26px;line-height:1.34;font-weight:700}.ask span{font-size:23px;line-height:1.36}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;justify-content:center;gap:10px;background:#111A2E;z-index:5}
.nav button,.nav a{font:600 15px 'Sarabun',sans-serif;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.4);border-radius:4px;padding:6px 15px;cursor:pointer;text-decoration:none}
.nav button:hover,.nav a:hover{background:rgba(255,255,255,.14)}.nav a.main{background:var(--sun);border-color:var(--sun);color:var(--ink)}
.nav button:focus-visible,.nav a:focus-visible{outline:2px solid var(--sun);outline-offset:2px}.nav .pg{color:#C4CAD6;font:500 15px 'Sarabun',sans-serif;padding:0 6px}
body.scroll{overflow:auto}body.scroll .stage{position:static;display:block;padding:12px 0 70px}
body.scroll .slide{display:grid;position:relative;transform-origin:top left}body.scroll .wrap{overflow:hidden;margin:0 auto 12px}
@media print{@page{size:1920px 1080px;margin:0}html,body{background:#fff;overflow:visible;height:auto}.nav{display:none}.stage{position:static;display:block}
  .slide{display:grid!important;position:relative;transform:none!important;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
/* page fill */
.def{grid-template-columns:225px 1fr}.def dd{font-size:27px}.def dt{font-size:29px}
.cap-chart{justify-content:space-between;gap:0;padding-top:6px}.hb{min-height:44px}.hb>div{height:28px}.hb label{font-size:26px}
.hours{height:430px}.two.peak td{font-size:26px;padding:17px 12px}.two.peak .note{font-size:23px}
.res td{font-size:26px;padding:21px 12px}.res th{font-size:23px}.stats.three>div{padding-top:20px;padding-bottom:20px}.stats.three b{font-size:42px}.stats.three span{font-size:24px}
.ct{min-height:50px}.tr{height:34px}.ct label{font-size:26px}.ct b{font-size:27px}.cost{gap:6px}
.matrix td{font-size:25px;padding:18px 10px}.matrix th{font-size:21px;padding:9px 6px}
.tl b{font-size:30px}.tl span{font-size:25px}.tl li::before{font-size:54px}
.asks{align-content:space-between;padding:34px 38px;gap:22px 44px}.asks h3{font-size:36px}.ask b{font-size:31px;line-height:1.32}.ask span{font-size:26px}.ask{padding-top:18px;gap:8px}
.plan{flex:1}.plan td{font-size:27px;padding:24px 12px}.plan th{font-size:23px}.plan .n{font:700 52px/1 'Bai Jamjuree',sans-serif;color:var(--teal)}.plan .w{font:700 29px/1.25 'Bai Jamjuree',sans-serif;color:var(--navy)}
{{EXTRA_CSS}}
</style>
</head>
<body>
<!--
THESIS: A test report for a manager that shows how close the 40GB machine is and asks to keep testing, refusing a dashboard of equal tiles.
OWN-WORLD: The approved Engenius decision-pack world: navy, teal, saffron, ink and vermilion full-height rails on a warm grey page, hairline tables, Bai Jamjuree numerals, no shadows.
STORY: The reader learns how the AI was tested, sees agreement rise round by round, sees what is fixed and what is not, then approves more testing.
FIRST VIEWPORT: Navy title field with logo beside four colour blocks carrying rounds, answers, latest agreement and rating.
FORM: Inherited from engenius-ai-capacity-deck (seed 945914a8), extended for round data.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<main class="stage" id="stage">
<!--SLIDES-->
</main>
<nav class="nav" aria-label="เลื่อนสไลด์">
  <button type="button" id="prev" aria-label="สไลด์ก่อนหน้า">← ก่อนหน้า</button>
  <span class="pg" id="pg"></span>
  <button type="button" id="next" aria-label="สไลด์ถัดไป">ถัดไป →</button>
  <button type="button" id="mode">อ่านแบบเลื่อน</button>
  {{NAVLINKS}}
</nav>
<script>
// Slides advance only from the buttons and keyboard, so dragging over text selects it for copying.
const slides=[...document.querySelectorAll('.slide')];
let i=0,scroll=false;
function fit(){
  if(scroll){
    const w=Math.min(innerWidth-16,1100),s=w/1920;
    slides.forEach(sl=>{sl.style.transform=`scale(${s})`;
      if(!sl.parentElement.classList.contains('wrap')){const d=document.createElement('div');d.className='wrap';sl.before(d);d.appendChild(sl)}
      sl.parentElement.style.width=w+'px';sl.parentElement.style.height=(1080*s)+'px'});
  }else{
    const s=Math.min(innerWidth/1920,(innerHeight-52)/1080)*.985;
    slides.forEach(sl=>sl.style.transform=`scale(${s})`);
  }
}
function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,k)=>s.classList.toggle('on',k===i));
  document.getElementById('pg').textContent=(i+1)+' / '+slides.length;try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
function setMode(sc){scroll=sc;document.body.classList.toggle('scroll',sc);
  document.getElementById('mode').textContent=sc?'โหมดนำเสนอ':'อ่านแบบเลื่อน';
  ['prev','next','pg'].forEach(id=>document.getElementById(id).style.display=sc?'none':'');
  if(!sc){document.querySelectorAll('.wrap').forEach(w=>w.replaceWith(w.firstChild));show(i)}
  fit()}
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('mode').onclick=()=>setMode(!scroll);
document.addEventListener('keydown',e=>{if(scroll||e.ctrlKey||e.metaKey)return;
  if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();show(i+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}
  if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
addEventListener('resize',fit);
const h=parseInt(location.hash.slice(1));show(Number.isFinite(h)?h-1:0);
setMode(innerWidth<820&&innerHeight>innerWidth);
</script>
</body>
</html>
