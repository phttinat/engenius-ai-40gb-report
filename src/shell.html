<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Trirong:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121212;--ink2:#4A4A4A;--ink3:#7A7A7A;--paper:#FFFFFF;--soft:#F3F3F1;--rule:#DCDCDC;
  --red:#D0021B;--redL:#FBE3E6;
  --display:'Trirong','Noto Sans Thai',serif;--body:'Noto Sans Thai',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#1C1C1C;color:var(--ink);font-family:var(--body);overflow:hidden}
::selection{background:var(--red);color:#fff}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}

.stage{position:fixed;inset:0 0 56px 0;display:flex;align-items:center;justify-content:center}
.slide{position:absolute;width:1920px;height:1080px;transform-origin:center center;display:none;overflow:hidden;background:var(--paper);
  padding:124px 120px 76px;-webkit-user-select:text;user-select:text;cursor:text}
.slide.on{display:flex;flex-direction:column}
/* running head: the magazine folio on every page */
.slide::before{content:"Engenius AI  ·  ผลทดสอบเครื่อง 40GB";position:absolute;left:120px;right:120px;top:46px;padding-bottom:16px;border-bottom:1px solid var(--rule);
  font:500 21px var(--body);letter-spacing:.02em;color:var(--ink3)}
/* inverse spreads give the issue its rhythm */
.g-cobalt{background:var(--ink);color:#fff}.g-cobalt::before{color:#9A9A9A;border-color:#3A3A3A}
.g-pink,.g-mint,.g-yellow,.g-white{background:var(--paper)}
.shp{display:none}

h1,h2,h3,.num{font-family:var(--display)}
h1{font-size:118px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
h2{font-size:62px;font-weight:700;line-height:1.2;max-width:1480px;text-wrap:balance}
h3{font-family:var(--body);font-size:30px;font-weight:700;line-height:1.3}
.sub{font-size:30px;line-height:1.55;color:var(--ink2);max-width:1300px;margin-top:18px}
.g-cobalt .sub,.g-cobalt .note{color:#BDBDBD}
p,li,td,th,dd,dt,span{font-variant-numeric:tabular-nums}
.head{margin-bottom:40px;position:relative}
.head::after{content:"";display:block;width:120px;height:6px;background:var(--red);margin-top:26px}

/* content areas: no boxes, the page is the surface */
.obj{position:relative;color:inherit}
.fill{flex:1;min-height:0;display:flex;flex-direction:column}
.cols{display:grid;gap:90px;flex:1;min-height:0}.c2{grid-template-columns:1fr 1fr}.c21{grid-template-columns:1.35fr 1fr}
.c2>.obj+.obj,.c21>.obj+.obj{border-left:1px solid var(--rule);padding-left:60px;margin-left:-30px}
.g-cobalt .c2>.obj+.obj{border-color:#3A3A3A}

.stk{display:inline-flex;align-items:center;gap:12px;font:700 25px/1 var(--body);white-space:nowrap}
.stk::before{content:"";width:16px;height:16px;border-radius:50%;background:var(--ink3)}
.stk.hi{color:var(--red)}.stk.hi::before{background:var(--red)}.stk.mid{color:#A55F00}.stk.mid::before{background:#E08A00}.stk.lo::before,.stk.ok::before{background:#9A9A9A}
.note{font-size:24px;line-height:1.55;margin-top:auto;padding-top:20px;color:var(--ink2)}

table{width:100%;border-collapse:collapse}
th{font:700 21px/1.3 var(--body);letter-spacing:.03em;text-align:left;padding:12px 14px;border-bottom:2px solid var(--ink);color:var(--ink2)}
.g-cobalt th{color:#BDBDBD;border-color:#fff}
td{font-size:30px;line-height:1.45;padding:20px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
.g-cobalt td{border-color:#3A3A3A}
tr:last-child td{border-bottom:none}
.r{text-align:right;white-space:nowrap}
td.n{font:700 56px/1 var(--display);color:var(--red)}
td .small{display:block;font:500 21px var(--body);color:var(--ink3);margin-top:6px}
tr.mark td{background:var(--redL)}
.was{color:var(--ink3);font:700 46px/1 var(--display);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:4px}
.now{color:var(--red);font:700 52px/1 var(--display)}
.g-cobalt .was{color:#9A9A9A}.g-cobalt .now{color:#FF4D5E}
td.thw{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}td.thn{font-weight:700}td.en{font-family:var(--display);font-style:italic}

/* cover: an issue cover with the numbers set as a contents column */
.cover{padding:0;flex-direction:row!important}
.cover::before{left:110px;right:110px}
.cover .c-l{flex:1.45;padding:150px 110px 90px;display:flex;flex-direction:column;justify-content:space-between}
.cover .c-r{flex:1;display:flex;flex-direction:column;justify-content:center;padding:150px 110px 90px 0}
.cover .c-r>div{border-top:2px solid var(--ink);padding:26px 0 32px;display:flex;flex-direction:column;background:none!important;color:var(--ink)!important}
.cover .c-r .num{font-size:116px;font-weight:700;line-height:1;color:var(--ink)}
.cover .c-r>div:first-child .num{color:var(--red)}
.cover .c-r span:not(.num){font-size:28px;line-height:1.45;margin-top:10px;color:var(--ink2);max-width:560px}
.logo{align-self:flex-start}.logo img{height:70px;display:block}
.cover .meta{font:500 30px/1.5 var(--body);color:var(--ink2);border-top:6px solid var(--red);padding-top:24px;max-width:900px;margin-top:40px!important}
.pg{position:absolute;right:120px;top:46px;font:600 21px var(--body);color:var(--ink3)}
.g-cobalt .pg{color:#9A9A9A}

/* 40GB vs 80GB: two figures set like a comparison spread */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:0;align-items:stretch;flex:1}
.disc{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-end;padding:0 60px 10px 0;background:none!important;border-top:2px solid var(--ink)}
.disc+.disc{padding-left:60px;border-left:1px solid var(--rule)}
.disc .num{font-size:220px!important;font-weight:700;line-height:1;margin-top:20px}
.disc.f-mint .num{color:var(--red)}
.disc b{font:700 36px var(--body);margin-top:6px}.disc span{font-size:28px;color:var(--ink2)}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;flex:1}
.step{border-top:2px solid var(--ink);padding:26px 30px 10px 0;display:flex;flex-direction:column;gap:16px;background:none}
.step+.step{padding-left:30px;border-left:1px solid var(--rule)}
.step .num{font-size:96px;font-weight:700;line-height:.9;color:var(--red)!important}
.step h3{font-size:36px}.step p{font-size:28px;line-height:1.5;color:var(--ink2)}
.step .gate{margin-top:auto;font:700 25px/1.45 var(--body);border-top:1px solid var(--rule);padding-top:16px}
.ask{margin-top:36px;font:700 34px/1.4 var(--display);color:var(--red);border-left:6px solid var(--red);padding-left:28px}

.hb{display:grid;grid-template-columns:1fr 520px 90px;gap:24px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule)}
.hb:last-child{border-bottom:none}
.hb label{font-size:29px;font-weight:600}.hb .tr{height:22px;background:var(--soft)}.hb i{display:block;height:100%;background:var(--ink)!important}
.hb:first-child i{background:var(--red)!important}
.hb b{font:700 44px var(--display);text-align:right}

.stack{display:flex;height:72px;margin:22px 0 14px}
.stack>div{display:flex;align-items:center;padding:0 18px;font:700 26px var(--body);white-space:nowrap}
.stack .f-cobalt{background:var(--ink)!important;color:#fff}.stack .f-pink{background:var(--red)!important}.stack .f-white{background:var(--soft)!important}
.legend{display:flex;flex-wrap:wrap;gap:12px 30px;font-size:24px;color:var(--ink2)}.legend i{display:inline-block;width:22px;height:22px;vertical-align:-4px;margin-right:8px}
.legend .f-cobalt{background:var(--ink)}.legend .f-pink{background:var(--red)}.legend .f-white{background:var(--soft);outline:1px solid var(--rule)}

.rchart .ax{font:500 22px var(--body);fill:#7A7A7A}.rchart .val{font:700 40px var(--display);fill:#121212}
.rchart .rn{font:700 26px var(--body);fill:#121212}.rchart .sub2{font:500 21px var(--body);fill:#7A7A7A}.rchart .wait{font:600 24px var(--body);fill:#7A7A7A}

.sum{display:grid;grid-template-columns:260px 1fr;border-top:2px solid var(--ink)}
.sum dt{font:700 36px var(--display);padding:24px 0;border-bottom:1px solid var(--rule);color:var(--red)}.sum dd{font-size:29px;line-height:1.55;padding:24px 0;border-bottom:1px solid var(--rule)}
.sum dt:last-of-type,.sum dd:last-of-type{border-bottom:none}

.nav{position:fixed;left:0;right:0;bottom:0;height:56px;display:flex;align-items:center;justify-content:center;gap:10px;background:#1C1C1C;z-index:5}
.nav button,.nav a{font:600 16px var(--body);color:#fff;background:transparent;border:1px solid rgba(255,255,255,.45);border-radius:4px;padding:6px 18px;cursor:pointer;text-decoration:none}
.nav button:hover,.nav a:hover{background:rgba(255,255,255,.12)}.nav a.main{background:var(--red);border-color:var(--red)}
.nav .pgn{color:#CFCFCF;font:600 16px var(--body);padding:0 6px}
body.scroll{overflow:auto}body.scroll .stage{position:static;display:block;padding:12px 0 76px}
body.scroll .slide{display:flex;flex-direction:column;position:relative;transform-origin:top left}body.scroll .slide.cover{flex-direction:row}
body.scroll .wrap{overflow:hidden;margin:0 auto 14px}
@media print{@page{size:1920px 1080px;margin:0}html,body{background:#fff;overflow:visible;height:auto}.nav{display:none}.stage{position:static;display:block}
  .slide{display:flex!important;position:relative;transform:none!important;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.obj.fill>table{height:100%}
.obj.fill .sum{height:100%;align-content:space-between}

.cover h1{font-size:100px}.cover .c-r .num{white-space:nowrap;font-size:104px}
{{EXTRA_CSS}}
</style>
</head>
<body>
<!--
THESIS: A weekly AI test update set like a business magazine issue: white pages, very large figures, one Engenius red, refusing coloured boxes and candy grounds.
OWN-WORLD: White paper with a running folio and hairline rules; Trirong serif for headlines and figures, Noto Sans Thai for reading; Engenius red as the only accent; black inverse spreads for rhythm.
STORY: The reader sees agreement climb, sees 40GB match 80GB, sees what is fixed and what is not, then agrees to more testing.
FIRST VIEWPORT: Issue cover: logo, a large serif title and red-ruled dateline on the left; a contents column of three figures separated by black rules on the right.
FORM: Clean editorial magazine (re-roll chosen by the user after Memphis), seed f2cde1e4.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance.
-->
<main class="stage" id="stage">
<!--SLIDES-->
</main>
<nav class="nav" aria-label="เลื่อนสไลด์">
  <button type="button" id="prev" aria-label="สไลด์ก่อนหน้า">← ก่อนหน้า</button>
  <span class="pgn" id="pg"></span>
  <button type="button" id="next" aria-label="สไลด์ถัดไป">ถัดไป →</button>
  <button type="button" id="mode">อ่านแบบเลื่อน</button>
  {{NAVLINKS}}
</nav>
<script>
// Slides advance only from the buttons and keyboard, so dragging over text selects it for copying.
const slides=[...document.querySelectorAll('.slide')];
let i=0,scroll=false;
function fit(){
  if(scroll){
    const w=Math.min(innerWidth-16,1100),s=w/1920;
    slides.forEach(sl=>{sl.style.transform=`scale(${s})`;
      if(!sl.parentElement.classList.contains('wrap')){const d=document.createElement('div');d.className='wrap';sl.before(d);d.appendChild(sl)}
      sl.parentElement.style.width=w+'px';sl.parentElement.style.height=(1080*s)+'px'});
  }else{
    const s=Math.min(innerWidth/1920,(innerHeight-56)/1080)*.985;
    slides.forEach(sl=>sl.style.transform=`scale(${s})`);
  }
}
function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,k)=>s.classList.toggle('on',k===i));
  document.getElementById('pg').textContent=(i+1)+' / '+slides.length;try{history.replaceState(null,'','#'+(i+1))}catch(e){}}
function setMode(sc){scroll=sc;document.body.classList.toggle('scroll',sc);
  document.getElementById('mode').textContent=sc?'โหมดนำเสนอ':'อ่านแบบเลื่อน';
  ['prev','next','pg'].forEach(id=>document.getElementById(id).style.display=sc?'none':'');
  if(!sc){document.querySelectorAll('.wrap').forEach(w=>w.replaceWith(w.firstChild));show(i)}
  fit()}
document.getElementById('prev').onclick=()=>show(i-1);
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('mode').onclick=()=>setMode(!scroll);
document.addEventListener('keydown',e=>{if(scroll||e.ctrlKey||e.metaKey)return;
  if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();show(i+1)}
  if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(i-1)}
  if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});
addEventListener('resize',fit);
const h=parseInt(location.hash.slice(1));show(Number.isFinite(h)?h-1:0);
setMode(innerWidth<820&&innerHeight>innerWidth);
</script>
</body>
</html>
